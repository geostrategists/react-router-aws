name: Code Quality

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  quality-check:
    name: Check Code Quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.22.0", "24"]

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node and Install Dependencies
        uses: ./.github/actions/setup-node-and-install-dependencies
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run oxlint
        run: pnpm lint

      - name: Check code formatting
        run: pnpm format:check

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  quality-check-result:
    name: Check Code Quality
    if: ${{ always() }}
    needs: quality-check
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require all Node versions to pass
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.quality-check.result }}
